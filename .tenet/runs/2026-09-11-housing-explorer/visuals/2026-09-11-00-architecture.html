<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부둥부둥 구조</title><style>:root{--ink:#263e34;--muted:#6b766e;--green:#315e49;--cream:#f8f6ee;--line:#e3e5d9;--mint:#e7efdf}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 15px;min-height:44px}button:hover{border-color:var(--green);background:#f2f5ed}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bf852d;outline-offset:3px}.preview{background:#263e34;color:#fff;padding:12px 5%;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}.preview button{font-size:12px;background:transparent;color:#fff;min-height:34px;padding:4px 12px;border-color:#687d70}.preview button[aria-pressed=true]{background:#e7efdf;color:var(--ink)}.shell{max-width:1180px;margin:auto;padding:0 32px 50px}header{display:flex;align-items:center;justify-content:space-between;padding:30px 0;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:850;letter-spacing:-1.5px;display:flex;align-items:center;gap:10px}.brand svg{width:34px;height:34px}.subtle{color:var(--muted);font-size:13px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;padding:40px 0 30px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;color:#71856a}h1{font-size:42px;line-height:1.25;letter-spacing:-2px;margin:12px 0 16px;font-weight:750}h1 em{font-style:normal;color:#638c58}.hero p{color:var(--muted);margin:0}.houseart{width:220px;height:150px;flex-shrink:0}.workspace{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;position:sticky;top:20px}.panel h2{font-size:19px;margin:0 0 20px}.label{display:block;font-size:13px;font-weight:650;margin:18px 0 7px}.amount{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;padding-right:14px}.amount input{width:100%;min-width:0;border:0;background:none;padding:12px;font-size:22px;font-weight:700;color:var(--ink)}.amount span{white-space:nowrap;color:var(--muted);font-size:13px}.moneyhint{font-size:12px;color:var(--muted);margin:4px 0}select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;color:var(--ink)}.segmented{display:flex;gap:6px;margin-top:14px}.segmented button{flex:1}.selected{background:var(--green)!important;color:white!important;border-color:var(--green)!important}.primary{background:var(--green);color:white;width:100%;margin-top:22px;border-color:var(--green);font-weight:650}.primary:hover{background:#244631;color:white}.note{font-size:11px;color:var(--muted);margin:12px 0 0}.privacy{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.banner{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#eeeadd;border-radius:12px;padding:11px 16px;font-size:12px;margin-bottom:18px}.badge{display:inline-block;font-size:11px;padding:3px 8px;border-radius:6px;background:#f2e7cb;color:#705620;white-space:nowrap}.summary{padding:25px;background:var(--mint);border-radius:22px;position:relative}.summary h2{font-size:26px;line-height:1.4;margin:6px 0 12px;letter-spacing:-1px}.summary p{font-size:12px;margin:0;color:#587154}.summary .tag{font-size:11px;color:#547349;letter-spacing:1px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.filters button{border-radius:24px;font-size:12px;min-height:38px}.filters b{margin-left:6px;opacity:.7}.resultline{display:flex;justify-content:space-between;gap:15px;font-size:12px;color:var(--muted);margin-bottom:14px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column}.card .category{font-size:11px;color:#698360;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.card h3{font-size:23px;line-height:1.35;margin:0 0 10px;letter-spacing:-.8px}.card .desc{font-size:12px;color:var(--muted);min-height:40px;margin:0}.metrics{display:flex;gap:14px;border-bottom:1px solid #eef0e7;padding:20px 0;margin-bottom:15px}.metric{flex:1}.metric small{display:block;color:var(--muted);font-size:10px}.metric strong{font-size:20px;letter-spacing:-.6px}.fact{font-size:11px;color:var(--muted)}.property{font-size:13px;font-weight:650;margin-bottom:3px}.card .detail{margin-top:18px;width:100%;background:#f8f9f3;border:0;font-size:12px}.compare{margin-top:16px;padding:20px;background:#fff9e7;border:1px solid #e9dfc3;border-radius:18px}.compare h3{margin:0 0 5px;font-size:17px}.compare p{font-size:12px;color:var(--muted)}.compare button{font-size:12px}.empty{grid-column:1/-1;padding:40px;text-align:center;background:white;border:1px dashed #bdcbb4;border-radius:20px}.error{color:#ab4337;font-size:12px}.footer{font-size:11px;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:15px}dialog{border:1px solid var(--line);border-radius:24px;padding:28px;max-width:470px;width:calc(100% - 32px);color:var(--ink)}dialog::backdrop{background:#192c2455;backdrop-filter:blur(3px)}dialog h2{line-height:1.4;margin-top:0}dialog p,dialog li{font-size:13px}dialog .close{float:right;margin-bottom:12px}input[type=range]{width:100%;accent-color:var(--green)}[hidden]{display:none!important}@media(max-width:760px){.shell{padding:0 18px 30px}header{padding:20px 0}.hero{padding:26px 0 24px}h1{font-size:32px}.houseart{display:none}.workspace{display:block}.panel{position:static;margin-bottom:20px;padding:20px}.cards{grid-template-columns:1fr}.preview{padding:1 1e5" stroke="#cdd7c3"/><text x="768" y="74" font-size="19" fill="#263e34">부둥부둥 카드</text><text x="768" y="99" font-size="12" fill="#64725e">한 문장 + 근거 + 거래 정보</text></g><g class="node"><title>키 보호 · 정규화 · 오류 구분</title><rect x="390" y="210" width="230" height="100" rx="16" fill="#eef1e5" stroke="#cdd7c3"/><text x="408" y="244" font-size="19" fill="#263e34">서버 거래 제공자</text><text x="408" y="269" font-size="12" fill="#64725e">키 보호 · 정규화 · 오류 구분</text></g><g class="node"><title>6종 실거래 / 인증키 필요</title><rect x="750" y="210" width="220" height="100" rx="16" fill="#eef1e5" stroke="#cdd7c3"/><text x="768" y="244" font-size="19" fill="#263e34">국토교통부 API</text><text x="768" y="269" font-size="12" fill="#64725e">6종 실거래 / 인증키 필요</text></g><g class="node"><title>권한 · 실제 지역 변환 · 수동 변경</title><rect x="20" y="350" width="340" height="70" rx="16" fill="#eef1e5" stroke="#cdd7c3"/><text x="38" y="384" font-size="19" fill="#263e34">위치 → 시·군·구</text><text x="38" y="409" font-size="12" fill="#64725e">권한 · 실제 지역 변환 · 수동 변경</text></g></svg><p class="footer">자산·소득은 서버에 전송하지 않는 설계입니다. 실거래 연결과 토스 입점은 각각 데이터 접근 검증과 플랫폼 검토가 필요합니다.</p><a href="2026-09-11-05-prototype-walkthrough.html">화면 체험으로 →</a></div></body></html>
