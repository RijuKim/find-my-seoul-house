<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>부둥부둥 필터 시안</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8faf4;color:#18304a;font:16px system-ui}main{max-width:900px;margin:auto}fieldset{border:1px solid #dfe7dc;border-radius:16px;margin:20px 0;padding:20px;background:white}legend{font-weight:700}button,select{font:inherit;padding:12px;border:1px solid #bccbb8;border-radius:10px;background:white;color:inherit;cursor:pointer}button[aria-pressed=true]{background:#d2f36b}label{display:inline-flex;gap:8px;margin:6px;align-items:center;min-height:44px}p,small{line-height:1.6}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}article{background:white;border:1px solid #dfe7dc;padding:20px;border-radius:16px}.muted{color:#5d706b}h1{font-size:28px}.choices{display:flex;flex-wrap:wrap;gap:8px}</style><main><small>부둥부둥 · 디자인 검토용 예시 데이터</small><h1>내 조건으로 실거래 찾아보기</h1><fieldset><legend>주택 유형</legend><div class="choices"><button aria-pressed="true" onclick="type='all';render()">전체</button><button aria-pressed="false" onclick="type='apartment';render()">아파트</button><button aria-pressed="false" onclick="type='villa';render()">빌라·다세대</button></div><p class="muted">빌라·다세대는 연립·다세대 실거래를 함께 조회해요.</p></fieldset><fieldset><legend>아파트 단지 규모</legend><label>조건 <select id="criterion" onchange="render()"><option value="either">100세대 미만 또는 1개 동</option><option value="households">100세대 미만</option><option value="buildings">1개 동</option></select></label><label>보기 <select id="mode" onchange="render()"><option value="all">전체</option><option value="only">조건에 맞는 단지만</option><option value="exclude">조건에 맞는 단지 제외</option><option value="unknown">규모 정보 없음</option></select></label><p class="muted">규모 필터는 아파트에 적용돼요. 확인되지 않은 단지는 별도로 구분하며, 제외하기에는 조건에 해당하지 않는 것으로 확인된 아파트만 표시해요.</p><p id="status" role="status"></p></fieldset><div class="cards" id="cards"></div></main><script>let type='all';const data=[{name:'예시 소형 아파트',type:'apartment',h:80,b:2},{name:'예시 단일동 아파트',type:'apartment',h:250,b:1},{name:'예시 일반 단지',type:'apartment',h:400,b:4},{name:'예시 미확인 아파트',type:'apartment'},{name:'예시 다세대',type:'villa'}];function render(){let c=document.querySelector('#criterion').value,m=document.querySelector('#mode').value;document.querySelectorAll('.choices button').forEach((b,i)=>b.setAttribute('aria-pressed',['all','apartment','villa'][i]===type));let rows=data.filter(x=>{if(type!=='all'&&x.type!==type)return false;if(m==='all'||x.type==='villa')return true;let h=x.h==null?null:x.h<100,b=x.b==null?null:x.b===1,v=c==='households'?h:c==='buildings'?b:h===true||b===true?true:h===false&&b===false?false:null;return m==='unknown'?v===null:m==='only'?v===true:v===false});document.querySelector('#cards').innerHTML=rows.map(x=>'<article><h2>'+x.name+'</h2><p>과거 신고 거래 · 예시</p><p>'+(x.type==='villa'?'규모 필터 적용 대상 아님':(x.h==null?'세대수 정보 없음':x.h+'세대')+' · '+(x.b==null?'동수 정보 없음':x.b+'개 동'))+'</p></article>').join('');document.querySelector('#status').textContent=rows.length+'개 예시 거래 표시 · 실제 확보율은 조회 시 별도 안내';}render();</script></html>
